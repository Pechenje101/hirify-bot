name: CI

on:
  push:
    paths-ignore:
      - 'data/**'   # коммиты БД от бота (режим Actions) тесты не гоняют
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка зависимостей
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Линт (ruff) — app/, tests/, tools/, scripts/
        run: ruff check .
      - name: Тесты
        run: pytest -q
