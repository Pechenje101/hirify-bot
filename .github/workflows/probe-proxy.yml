name: probe-proxy

# Живая проверка прокси из секрета HIRIFY_PROXY: trace (исходящий IP) +
# анонимный фид api.hirify.me через прокси (curl_cffi + httpx). БЕЗ cookie,
# БЕЗ запросов к вакансиям/контактам — риска для аккаунта ноль. Бота не
# перезапускает (не входит в paths-фильтр bot.yml).
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установка зависимостей
        run: pip install -r requirements.txt h2 curl_cffi

      - name: Зонд прокси (анонимно)
        env:
          HIRIFY_PROXY: ${{ secrets.HIRIFY_PROXY }}
        run: python tools/probe_proxy.py
