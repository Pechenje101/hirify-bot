name: probe-proxy

# Живая проверка прокси из секрета HIRIFY_PROXY: trace (исходящий IP) +
# анонимный фид api.hirify.me через прокси (curl_cffi + httpx). БЕЗ cookie,
# БЕЗ запросов к вакансиям/контактам — риска для аккаунта ноль. Бота не
# перезапускает (не входит в paths-фильтр bot.yml).
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установка зависимостей
        run: pip install -r requirements.txt h2 curl_cffi

      - name: Зонд прокси (анонимно)
        env:
          HIRIFY_PROXY: ${{ secrets.HIRIFY_PROXY }}
          PROBE_CANDIDATES: >-
            http://43.128.144.133:18080,
            http://141.94.22.37:3128,
            http://176.111.37.216:39811,
            http://4.144.146.21:80,
            http://27.147.155.206:12051,
            http://103.237.102.191:11111,
            http://184.170.169.216:8888,
            http://130.110.103.245:3128,
            http://90.156.160.234:3128,
            http://185.194.121.232:3128,
            http://206.135.53.53:999
        run: python tools/probe_proxy.py
