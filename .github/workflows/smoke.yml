name: smoke

# Минимальная живая проверка сессии hirify: один проход конвейера
# (фид → API → контакты → карточка) по ДВУМ вакансиям. Запуск вручную.
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установка зависимостей
        run: pip install -r requirements.txt
      - name: "Сквозной smoke: фид→API→контакты→карточка"
        env:
          HIRIFY_COOKIE: ${{ secrets.HIRIFY_COOKIE }}
        run: python tools/probe_e2e.py
