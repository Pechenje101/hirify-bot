name: probe

# Диагностика живого hirify.me без cookie (запускается вручную/с ветки probe).
# Песочница разработки не имеет доступа к сайту — раннику Actions сеть открыта.
on:
  workflow_dispatch:
  push:
    branches: [probe]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установка зависимостей
        run: pip install -r requirements.txt
      - name: Живая диагностика без cookie
        run: python tools/probe_live.py
      - name: Диагностика API и JS
        run: python tools/probe_api.py
      - name: Скачать HTML/JS как артефакты
        run: python tools/probe_deep.py
      - name: "Чанки: поиск API вакансий + проверка с cookie"
        env:
          HIRIFY_COOKIE: ${{ secrets.HIRIFY_COOKIE }}
        run: python tools/probe_chunks.py
      - name: "API вакансии с cookie: структура JSON"
        env:
          HIRIFY_COOKIE: ${{ secrets.HIRIFY_COOKIE }}
        run: python tools/probe_vac_api.py
      - name: "Сквозной тест: фид→API→контакты→карточка"
        env:
          HIRIFY_COOKIE: ${{ secrets.HIRIFY_COOKIE }}
        run: python tools/probe_e2e.py || true
      - name: "API фида: список с фильтрами + пресеты"
        env:
          HIRIFY_COOKIE: ${{ secrets.HIRIFY_COOKIE }}
        run: python tools/probe_feed_api.py || true
      - name: "Пресеты лендингов и полнота элемента списка"
        env:
          HIRIFY_COOKIE: ${{ secrets.HIRIFY_COOKIE }}
        run: python tools/probe_landing.py
      - name: Upload артефактов
        uses: actions/upload-artifact@v4
        with:
          name: probe-files
          path: debug/
          retention-days: 3
