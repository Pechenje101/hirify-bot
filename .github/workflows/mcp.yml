name: mcp

# Проверка официального MCP-API hirify: initialize → tools → вызов.
# Запуск вручную. Креды не печатаются.
on:
  workflow_dispatch:

jobs:
  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установка зависимостей
        run: pip install -r requirements.txt
      - name: "MCP: initialize → tools/list → вызов"
        env:
          HIRIFY_COOKIE: ${{ secrets.HIRIFY_COOKIE }}
        run: python tools/probe_mcp2.py
