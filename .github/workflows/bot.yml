name: bot

# ── Бот «24/7» на GitHub Actions ──────────────────────────────────────────────
# Job здесь живёт максимум 6 часов, поэтому бот сам плавно останавливается
# через RUN_MAX_MINUTES=330, после чего:
#   1) состояние (SQLite: дедуп вакансий, подписчики, настройки) коммитится в ветку
#      (cookie из БД вычищается — он живёт в секретах и не должен попадать в репо);
#   2) ран запускает сам себя через workflow_dispatch (эстафета).
# Триггеры:
#   workflow_dispatch — ручной запуск/перезапуск (кнопка «Run workflow»);
#   push в main       — обновили код → бот перезапускается с новой версией
#                       СРАЗУ: новый ран замещает текущий (cancel-in-progress),
#                       состояние успевает сохраниться (always());
#                       (коммиты БД от GITHUB_TOKEN циклов не создают);
#   schedule раз в сутки — страховка, если эстафета оборвалась.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:   # перезапускать бота только при изменениях кода (не README/tools)
      - 'app/**'
      - 'main.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/bot.yml'
  schedule:
    # страховка раз в сутки (06:23 МСК): поднимет бота, если эстафета оборвалась.
    # Реже, чем раньше: с cancel-in-progress любой триггер замещает живой ран,
    # лишняя ротация каждые 6 часов не нужна.
    - cron: '23 3 * * *'

# Каждое обновление разворачивается СРАЗУ: новый ран (push/dispatch/cron)
# замещает текущий. Отменённый ран успевает сохранить БД (шаг always()),
# а эстафета включается только при естественном финале (см. шаг ниже) —
# отменённый ран НИКОГДА не плодит дубли.
concurrency:
  group: bot
  cancel-in-progress: true

permissions:
  contents: write   # коммит data/hirify_bot.db
  actions: write    # self-dispatch (workflow_dispatch — исключение из правил GITHUB_TOKEN)

jobs:
  run:
    runs-on: ubuntu-latest
    # жёсткий предел GitHub — 6 ч; бот сам выходит на 330-й минуте, это лишь страховка
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Запуск бота (до 330 минут)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          HIRIFY_COOKIE: ${{ secrets.HIRIFY_COOKIE }}
          # критичные команды (/setcookie, /pause, /resume) — только владелец
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          RUN_MAX_MINUTES: '330'
          DROP_PENDING_UPDATES: '0'
          INDUSTRY_STRICT: '1'
          # источники-дополнение: публичные ТГ-КАНАЛЫ с вакансиями
          # (читаются анонимно через веб-превью t.me/s/<имя>). ВАЖНО: только
          # каналы — у ЧАТОВ (напр. payments_lenkep) анонимного превью нет
          TG_CHANNELS: 'cpa_people,opento_igaming,IT_iGaming'
          # «суточный цикл человека»: базовый интервал 30 мин (с джиттером
          # ~25–40), ночью ×3, утренний проход «метлой». Меньше запросов к
          # сайту — меньше поводов для флага automation_detected.
          POLL_MINUTES: '30'
          LOG_LEVEL: INFO
        run: python main.py

      - name: Сохранить состояние (SQLite) в репозиторий
        # ВАЖНО: always(), а НЕ !cancelled() — cancelled() истинно именно
        # при отмене рана, и !cancelled() тогда ПРОПУСКАЕТ шаг. С always()
        # БД коммитится и при отмене (иначе настройки подписчиков — вид
        # карточек, разделы, /start — терялись бы на каждом рестарте).
        if: ${{ always() }}
        run: |
          git config user.name "hirify-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f data/hirify_bot.db ]; then
            # cookie не должен попадать в публичный репозиторий: в ране он
            # приходит из секрета HIRIFY_COOKIE, из БД его вычищаем
            sqlite3 data/hirify_bot.db "DELETE FROM settings WHERE key='hirify_cookie';"
            # ВАЖНО, WAL: бот пишет в data/hirify_bot.db-wal, основной .db при
            # жёсткой отмене рана остаётся ПУСТЫМ (без чистого close не бывает
            # чекпоинта) — без этой строки каждое замещение рана теряло бы ВСЁ
            # состояние: подписчиков, дедуп, настройки. Чекпоинт вливает WAL
            # в основной файл, который мы и коммитим.
            sqlite3 data/hirify_bot.db "PRAGMA wal_checkpoint(TRUNCATE);" || true
            git add -f data/hirify_bot.db
          fi
          if git diff --cached --quiet; then
            echo "Состояние не изменилось"
          else
            git commit -m "chore(bot): состояние БД [skip ci]"
            # БД бинарная: обычный rebase умирает на конфликте «HEAD vs. [skip ci]»
            # и хвост состояния рана терялся. -X theirs — в конфликте побеждает
            # НАШ (более свежий) вариант: замещённый ран жил позже remote-типа.
            git pull --rebase -X theirs --autostash || true
            git push || echo "⚠️ Не удалось запушить БД (продолжаем)"
          fi

      - name: "Эстафета: перезапустить бота"
        # ТОЛЬКО при естественном финале (330 мин / сбой): отменённый ран НЕ
        # перезапускает себя сам. Причину отмены знать не нужно: если нас
        # заместил новый ран (push/очередь/cron — cancel-in-progress), эстафета —
        # он сам; если отменили руками (gh_ctl/GitHub UI) — остановка намеренная,
        # и бот поднимет gh_ctl start или страховочный cron. Так исчезает гонка
        # «отменённый ран не видит заместителя в API» (список ранов отстаёт
        # от событий на десятки секунд — проверка по статусам не надёжна).
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 5   # если одновременно с финалом пришёл пуш — даём ему появиться в списке
          OTHERS=$(gh run list --workflow bot.yml --limit 15 --json databaseId,status \
            | jq --arg id "${GITHUB_RUN_ID}" \
              '[.[] | select(.databaseId != ($id | tonumber))
                | select(.status == "queued" or .status == "in_progress")] | length')
          if [ "${OTHERS:-0}" != "0" ]; then
            echo "✅ В группе уже есть живой ран (${OTHERS}) — эстафету подхватывает он, новый не запускаю"
            exit 0
          fi
          if gh workflow run bot.yml --ref "${GITHUB_REF_NAME}"; then
            echo "✅ Новый ран запущен — эстафета продолжается"
          elif [ -n "${{ secrets.PAT_TOKEN }}" ]; then
            echo "Фолбэк: перезапуск через PAT_TOKEN"
            GH_TOKEN="${{ secrets.PAT_TOKEN }}" gh workflow run bot.yml --ref "${GITHUB_REF_NAME}"
          else
            echo "⚠️ Перезапуск не удался — подхватит страховочный cron (раз в сутки)"
            exit 1
          fi
